[project]
name = "vidx"
version = "0.1.0"
description = "Token-efficient video understanding + editing for LLM agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.1",
    "scenedetect>=0.7",
    "faster-whisper>=1.0",
    "open_clip_torch>=2.24",
    "torch>=2.2",
    "mcp>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
captions = ["transformers>=4.40", "einops", "timm"]
otio = ["opentimelineio>=0.17"]

[project.scripts]
vidx = "vidx.cli:app"
vidx-mcp = "vidx.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidx"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs ffmpeg + model weights (end-to-end)"]
